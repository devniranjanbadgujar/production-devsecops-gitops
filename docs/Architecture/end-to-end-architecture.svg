<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63738b"/></marker></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#566176}.head{font-size:17px;font-weight:700}.body{font-size:13px}.small{font-size:11px;fill:#566176}.card{fill:#fff;stroke:#ccd5e2;stroke-width:1.5}.blue{fill:#eaf2ff;stroke:#7ba5e8}.purple{fill:#f3edff;stroke:#ad91e8}.green{fill:#e8f8ef;stroke:#6ebc8d}.orange{fill:#fff3e5;stroke:#e8ae66}.dark{fill:#e9edf3;stroke:#9aa7b8}.line{stroke:#63738b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="40" y="48" class="title">End-to-End DevSecOps + GitOps Architecture</text><text x="40" y="75" class="subtitle">Commit → CI and security → ECR → GitOps → Argo CD → EKS → monitoring</text><rect x="35" y="140" width="220" height="140" rx="14" class="blue"/><text x="51" y="169" class="head">Developer</text><text x="51" y="194" class="body">Commit and push code</text><text x="51" y="213" class="body">Application GitHub repo</text><rect x="300" y="140" width="250" height="185" rx="14" class="purple"/><text x="316" y="169" class="head">Jenkins CI</text><text x="316" y="194" class="body">Backend tests + lint</text><text x="316" y="213" class="body">Frontend lint + build</text><text x="316" y="232" class="body">npm audit reports</text><text x="316" y="251" class="body">Build images + Trivy scan</text><rect x="595" y="140" width="230" height="140" rx="14" class="green"/><text x="611" y="169" class="head">Amazon ECR</text><text x="611" y="194" class="body">Backend image</text><text x="611" y="213" class="body">Frontend image</text><text x="611" y="232" class="body">Commit/build tags</text><rect x="870" y="140" width="250" height="170" rx="14" class="orange"/><text x="886" y="169" class="head">GitOps repository</text><text x="886" y="194" class="body">Jenkins updates image values</text><text x="886" y="213" class="body">Image-value validation</text><text x="886" y="232" class="body">Commit/push to main</text><rect x="1165" y="140" width="200" height="140" rx="14" class="blue"/><text x="1181" y="169" class="head">Argo CD</text><text x="1181" y="194" class="body">Watch GitOps branch</text><text x="1181" y="213" class="body">Automated sync + self-heal</text><rect x="1400" y="140" width="165" height="140" rx="14" class="purple"/><text x="1416" y="169" class="head">Helm</text><text x="1416" y="194" class="body">Render chart</text><text x="1416" y="213" class="body">Reconcile resources</text><path d="M255,210 L300,210" class="line "/><path d="M550,210 L595,210" class="line "/><path d="M825,210 L870,210" class="line "/><path d="M1120,210 L1165,210" class="line "/><path d="M1365,210 L1400,210" class="line "/><rect x="35" y="390" width="1050" height="440" rx="20" fill="#eef4fb" stroke="#9ab4d7" stroke-width="2"/><text x="60" y="425" class="head">AWS account / EKS runtime (when deployed)</text><rect x="70" y="470" width="220" height="130" rx="14" class="orange"/><text x="86" y="499" class="head">ALB Ingress</text><text x="86" y="524" class="body">Internet-facing frontend</text><text x="86" y="543" class="body">AWS Load Balancer Controller</text><rect x="345" y="470" width="210" height="130" rx="14" class="blue"/><text x="361" y="499" class="head">Frontend</text><text x="361" y="524" class="body">React app served by Nginx</text><text x="361" y="543" class="body">Kubernetes Service</text><rect x="610" y="470" width="210" height="130" rx="14" class="purple"/><text x="626" y="499" class="head">Backend API</text><text x="626" y="524" class="body">Express on :8080</text><text x="626" y="543" class="body">JWT auth + health API</text><rect x="355" y="665" width="205" height="120" rx="14" class="green"/><text x="371" y="694" class="head">MongoDB</text><text x="371" y="719" class="body">Service + PVC</text><text x="371" y="738" class="body">Persistent data</text><rect x="630" y="665" width="205" height="120" rx="14" class="green"/><text x="646" y="694" class="head">Redis</text><text x="646" y="719" class="body">Service + PVC</text><text x="646" y="738" class="body">Append-only persistence</text><path d="M290,535 L345,535" class="line "/><path d="M555,535 L610,535" class="line "/><path d="M715,600 L715,640" class="line "/><path d="M665,600 L460,665" class="line "/><path d="M720,600 L730,665" class="line "/><rect x="1125" y="425" width="435" height="175" rx="14" class="green"/><text x="1141" y="454" class="head">Observability (separate Helm release)</text><text x="1141" y="479" class="body">Prometheus scrapes node and Kubernetes metrics</text><text x="1141" y="498" class="body">node-exporter + kube-state-metrics</text><text x="1141" y="517" class="body">Grafana dashboards for CPU, memory, pods</text><text x="1141" y="536" class="body">Alertmanager included by kube-prometheus-stack</text><path d="M1085,600 L1125,515" class="line dash"/><rect x="1125" y="650" width="435" height="130" rx="14" class="dark"/><text x="1141" y="679" class="head">Evidence captured</text><text x="1141" y="704" class="body">Jenkins pipeline / scan results</text><text x="1141" y="723" class="body">Argo CD Synced + Healthy</text><text x="1141" y="742" class="body">EKS pods and Grafana dashboards</text><path d="M1340,600 L1340,650" class="line dash"/><rect x="45" y="900" width="490" height="115" rx="14" class="dark"/><text x="61" y="929" class="head">Terraform infrastructure</text><text x="61" y="954" class="body">VPC, subnets, routes, NAT/IGW</text><text x="61" y="973" class="body">EKS, managed nodes, IAM, ECR</text><rect x="585" y="900" width="490" height="115" rx="14" class="blue"/><text x="601" y="929" class="head">GitOps controls</text><text x="601" y="954" class="body">Automated sync + self-heal</text><text x="601" y="973" class="body">prune=false; secrets kept outside Git</text><rect x="1125" y="900" width="435" height="115" rx="14" class="orange"/><text x="1141" y="929" class="head">Cost and teardown note</text><text x="1141" y="954" class="body">Infrastructure was torn down after evidence capture</text><text x="1141" y="973" class="body">Redeploy only after reviewing cost and destroy plans</text><path d="M285,900 L285,830" class="line dash"/><path d="M830,900 L830,830" class="line dash"/><path d="M710,280 L710,350 L900,350 L900,390" class="line dash"/><path d="M1480,280 L1480,350 L1050,350 L1050,390" class="line dash"/></svg>