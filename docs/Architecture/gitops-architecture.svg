<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63738b"/></marker></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#566176}.head{font-size:17px;font-weight:700}.body{font-size:13px}.small{font-size:11px;fill:#566176}.card{fill:#fff;stroke:#ccd5e2;stroke-width:1.5}.blue{fill:#eaf2ff;stroke:#7ba5e8}.purple{fill:#f3edff;stroke:#ad91e8}.green{fill:#e8f8ef;stroke:#6ebc8d}.orange{fill:#fff3e5;stroke:#e8ae66}.dark{fill:#e9edf3;stroke:#9aa7b8}.line{stroke:#63738b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="40" y="48" class="title">GitOps Repository Architecture</text><text x="40" y="75" class="subtitle">Argo CD watches Git and reconciles the Helm chart into the EKS application namespace</text><rect x="45" y="145" width="280" height="155" rx="14" class="purple"/><text x="61" y="174" class="head">Jenkins (external)</text><text x="61" y="199" class="body">Build and scan images</text><text x="61" y="218" class="body">Push images to ECR</text><text x="61" y="237" class="body">Update values-ecr.yaml</text><rect x="390" y="145" width="280" height="155" rx="14" class="blue"/><text x="406" y="174" class="head">GitHub GitOps repo</text><text x="406" y="199" class="body">Argo CD Application YAML</text><text x="406" y="218" class="body">Helm chart and templates</text><text x="406" y="237" class="body">values.yaml + values-ecr.yaml</text><rect x="735" y="145" width="260" height="155" rx="14" class="green"/><text x="751" y="174" class="head">Argo CD</text><text x="751" y="199" class="body">Watches main branch</text><text x="751" y="218" class="body">Automated sync + self-heal</text><text x="751" y="237" class="body">Pruning disabled</text><rect x="1060" y="145" width="285" height="155" rx="14" class="orange"/><text x="1076" y="174" class="head">Helm reconciliation</text><text x="1076" y="199" class="body">Render chart values</text><text x="1076" y="218" class="body">Apply Kubernetes resources</text><text x="1076" y="237" class="body">Namespace: production-devsecops</text><path d="M325,220 L390,220" class="line "/><path d="M670,220 L735,220" class="line "/><path d="M995,220 L1060,220" class="line "/><rect x="65" y="435" width="285" height="145" rx="14" class="blue"/><text x="81" y="464" class="head">Frontend</text><text x="81" y="489" class="body">Deployment + ClusterIP Service</text><text x="81" y="508" class="body">Readiness probe on /</text><rect x="405" y="435" width="285" height="145" rx="14" class="purple"/><text x="421" y="464" class="head">Backend API</text><text x="421" y="489" class="body">Deployment + Service :8080</text><text x="421" y="508" class="body">Health probes: /api/health</text><text x="421" y="527" class="body">JWT secret via Kubernetes Secret</text><rect x="745" y="435" width="250" height="145" rx="14" class="green"/><text x="761" y="464" class="head">MongoDB</text><text x="761" y="489" class="body">mongo:7</text><text x="761" y="508" class="body">Service :27017</text><text x="761" y="527" class="body">PVC mounted at /data/db</text><rect x="1050" y="435" width="285" height="145" rx="14" class="green"/><text x="1066" y="464" class="head">Redis</text><text x="1066" y="489" class="body">redis:7-alpine</text><text x="1066" y="508" class="body">Service :6379</text><text x="1066" y="527" class="body">AOF + PVC at /data</text><path d="M1200,300 L1200,380" class="line "/><path d="M1200,380 L210,380" class="line "/><path d="M210,380 L210,435" class="line "/><path d="M550,380 L550,435" class="line "/><path d="M880,380 L880,435" class="line "/><path d="M1190,380 L1190,435" class="line "/><path d="M350,505 L405,505" class="line "/><path d="M690,505 L745,505" class="line "/><path d="M690,535 L1050,535" class="line "/><rect x="65" y="660" width="380" height="130" rx="14" class="orange"/><text x="81" y="689" class="head">ALB Ingress (optional)</text><text x="81" y="714" class="body">Requires AWS Load Balancer Controller</text><text x="81" y="733" class="body">Internet-facing when configured</text><rect x="500" y="660" width="380" height="130" rx="14" class="dark"/><text x="516" y="689" class="head">Configuration and secrets</text><text x="516" y="714" class="body">ConfigMap: MongoDB / Redis URLs</text><text x="516" y="733" class="body">JWT secret pre-created outside Git</text><text x="516" y="752" class="body">Optional Jenkins report credentials</text><rect x="935" y="660" width="400" height="130" rx="14" class="dark"/><text x="951" y="689" class="head">External dependencies</text><text x="951" y="714" class="body">EKS + ECR images already exist</text><text x="951" y="733" class="body">StorageClass + EBS CSI for PVCs</text><text x="951" y="752" class="body">AWS networking and IAM</text><text x="45" y="850" class="small">The chart does not provision EKS, ECR, IAM, or the monitoring stack. Those are external dependencies.</text></svg>