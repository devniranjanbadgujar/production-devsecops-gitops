apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-devsecops-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devniranjanbadgujar/production-devsecops-gitops.git
    targetRevision: main
    path: apps/production-devsecops-platform
    helm:
      valueFiles:
        - values.yaml
        - values-ecr.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production-devsecops