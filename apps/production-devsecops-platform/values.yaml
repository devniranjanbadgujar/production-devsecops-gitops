storageClassName: gp2

backend:
  image: production-devsecops-platform-backend
  tag: "5"
  pullPolicy: IfNotPresent

frontend:
  image: production-devsecops-platform-frontend
  tag: "5"
  pullPolicy: IfNotPresent

mongodb:
  image: mongo:7
  storage: 1Gi

redis:
  image: redis:7-alpine
  storage: 1Gi

secrets:
  existingSecret: "production-devsecops-secrets"

# Requires AWS Load Balancer Controller installed in the cluster.
ingress:
  enabled: false
  scheme: internet-facing
